<div class="container mt-4">
  <h2>Add a New Trip</h2>

  <!-- Success message -->
  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <form (ngSubmit)="addTrip()">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input class="form-control" [(ngModel)]="newTrip.title" name="title" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Location</label>
      <input class="form-control" [(ngModel)]="newTrip.location" name="location" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Price</label>
      <input class="form-control" [(ngModel)]="newTrip.price" name="price" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Duration</label>
      <input class="form-control" [(ngModel)]="newTrip.duration" name="duration" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" [(ngModel)]="newTrip.description" name="description"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Add Trip</button>
  </form>
</div>
